[project]
name = "telegram-cli"
version = "0.2.0"
description = "List unread Telegram chats and read chat history from your account"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["telethon>=1.36,<2"]

[project.scripts]
telegram-cli = "telegram_cli.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telegram_cli*"]
